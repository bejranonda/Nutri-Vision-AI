name = "eatinorder"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"

[vars]
# Environment variables set via Cloudflare dashboard

[[d1_databases]]
binding = "DB"
database_name = "eatinorder-db"
database_id = "0fde5517-dda7-47e5-8f49-e33027069c1a"
# Drizzle generates SQL migrations into `drizzle/` (with sibling
# `drizzle/meta/_journal.json` tracking which have been applied).
# Wrangler's default lookup is `migrations/`, so we point it at the
# Drizzle output explicitly. Without this, `wrangler d1 migrations
# apply` reports "No migrations present" and fails to advance the DB.
migrations_dir = "drizzle"

[ai]
binding = "AI"


